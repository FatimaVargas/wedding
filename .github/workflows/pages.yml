name: Publish wedding website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Test the integration logic
        run: node --test tests/*.test.mjs
      - name: Export static website
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          base="${PAGES_BASE%/}/"
          node scripts/export-github.mjs "$base"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
